# ################################################################################
# #
# # OpenSUSE ROCm Test Suite - Short Qualification & Stress Configuration (~10s)
# #
# # Modules tested:
# # 1. GPUP (~0.2s): GPU properties, topology, HSA agents
# # 2. PEQT (~0.2s): PCIe driver binding (amdgpu), link speed/width, atomics
# # 3. GST  (~5.0s): Short SGEMM compute pulse via rocBLAS
# # 4. PEBB (~3.0s): Host-to-Device and Device-to-Host DMA memory transfers
# #
# ################################################################################

actions:
# 1. GPU Properties Check
- name: qual_gpup
  device: all
  module: gpup
  properties:
    all:
  io_links-properties:
    all:

# 2. PCIe Infrastructure Qualification
- name: qual_peqt
  device: all
  module: peqt
  capability:
    link_cap_max_speed:
    link_cap_max_width:
    link_stat_cur_speed:
    link_stat_neg_width:
    slot_pwr_limit_value:
    slot_physical_num:
    deviceid:
    vendor_id:
    kernel_driver:
    dev_serial_num:
    atomic_op_routing:
    atomic_op_32_completer:
    atomic_op_64_completer:
    atomic_op_128_CAS_completer:

# 3. Short Compute Stress (~5s SGEMM workload)
- name: stress_gst
  device: all
  module: gst
  parallel: false
  count: 1
  duration: 5000
  ramp_interval: 1000
  log_interval: 1000
  copy_matrix: false
  target_stress: 500
  matrix_size_a: 2048
  matrix_size_b: 2048
  matrix_size_c: 2048
  ops_type: sgemm
  lda: 2048
  ldb: 2048
  ldc: 2048

# 4. Short PCIe DMA Memory Transfer Stress (~3s)
- name: stress_pebb
  device: all
  module: pebb
  log_interval: 1000
  duration: 3000
  device_to_host: true
  host_to_device: true
  parallel: true
  block_size: 51200000
  link_type: 2
