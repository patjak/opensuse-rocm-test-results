<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>openSUSE ROCm Test Dashboard</title>
    <style>
        :root {
            --bg: #f6f8fa;
            --card-bg: #ffffff;
            --text: #24292f;
            --text-muted: #57606a;
            --border: #d0d7de;
            --pass-bg: #dafbe1; --pass-fg: #1a7f37;
            --fail-bg: #ffebe9; --fail-fg: #cf222e;
            --skip-bg: #fff8c5; --skip-fg: #9a6700;
            --accent: #0969da;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 2rem;
        }
        .container {
            max-width: 1500px;
            margin: 0 auto;
        }
        header {
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
        }
        h1 {
            margin: 0 0 0.5rem 0;
            font-size: 1.5rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: var(--text);
        }
        p { color: var(--text-muted); margin: 0; font-size: 0.9rem; }
        .seq-badge {
            background: #ddf4ff;
            color: #0969da;
            border: 1px solid rgba(54, 150, 255, 0.4);
            font-size: 0.8rem;
            padding: 0.15rem 0.55rem;
            border-radius: 12px;
            font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
            font-weight: 600;
        }
        .table-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow-x: auto;
            box-shadow: 0 1px 3px rgba(31, 35, 40, 0.12);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.875rem;
        }
        th, td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        th {
            background-color: #f6f8fa;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background-color: #f6f8fa; }
        .status {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.75rem;
            border: 1px solid transparent;
        }
        .status.pass { background: var(--pass-bg); color: var(--pass-fg); border-color: rgba(26, 127, 55, 0.2); }
        .status.fail { background: var(--fail-bg); color: var(--fail-fg); border-color: rgba(207, 34, 46, 0.2); }
        .status.skip { background: var(--skip-bg); color: var(--skip-fg); border-color: rgba(154, 103, 0, 0.2); }
        .status.bold { font-weight: 700; }
        .badge.os {
            background: #f6f8fa;
            color: #24292f;
            border: 1px solid var(--border);
            padding: 0.15rem 0.4rem;
            border-radius: 6px;
            font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
            font-size: 0.8rem;
        }
        code {
            background: rgba(175, 184, 193, 0.2);
            padding: 0.15rem 0.35rem;
            border-radius: 6px;
            color: #24292f;
            font-size: 0.85rem;
            font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
        }
        .time { color: var(--text-muted); font-size: 0.85rem; }
        .log-link {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
        }
        .log-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="history/index.html" class="log-link" style="float: right;">📜 View Test History</a>
            <h1>openSUSE ROCm Test Dashboard <span class="seq-badge">Batch -</span></h1>
            <p>Automated daily status across homelab hardware and distribution releases.</p>
        </header>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>OS</th>
                        <th>Machine</th>
                        <th>GPU Model</th>
                        <th>GFX</th>
                        <th>ROCm</th>
                        <th>Driver</th>
                        <th>hipcc</th>
                        <th>Blender HIP</th>
                        <th>LLaMA HIP</th>
                        <th>Overall</th>
                        <th>Last Tested</th>
                        <th>Log</th>
                    </tr>
                </thead>
                <tbody>
                    
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
